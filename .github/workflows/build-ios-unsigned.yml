name: Build iOS Unsigned

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios-unsigned:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPECTED_XCODE_VERSION: 26.4.1
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Select and verify Xcode 26.4.1
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.4.1.app
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          ACTUAL_XCODE_VERSION="$(xcodebuild -version | awk 'NR==1 { print $2 }')"
          test "$ACTUAL_XCODE_VERSION" = "$EXPECTED_XCODE_VERSION"
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Verify CocoaPods version
        shell: bash
        run: |
          set -euo pipefail
          test "$(pod --version)" = "1.17.0"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Expo dependency matrix and config
        run: |
          pnpm expo:check
          pnpm expo:config

      - name: Generate the native iOS project
        working-directory: apps/mobile
        run: pnpm run prebuild:ios

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build the unsigned iphoneos app
        working-directory: apps/mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          SCHEME_FILE="$(find . -path './Pods' -prune -o -path './*.xcodeproj/xcshareddata/xcschemes/*.xcscheme' -print -quit)"
          test -f "$SCHEME_FILE"
          SCHEME="$(basename "$SCHEME_FILE" .xcscheme)"
          test -n "$SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -showBuildSettings >/dev/null
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build

      - name: Package and verify the unsigned IPA
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$APP_PATH"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"
          test -s "$EXECUTABLE_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$APP_PATH/Info.plist")" = "iphoneos"
          file "$EXECUTABLE_PATH"
          lipo -archs "$EXECUTABLE_PATH" | tr ' ' '\n' | grep -qx arm64
          if codesign --verify --deep --strict "$APP_PATH" >/dev/null 2>&1; then
            echo 'Le bundle ne devrait pas être signé.' >&2
            exit 1
          fi

          VERSION="$(node -p "require('./app.json').expo.version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          IPA_NAME="ParentsFreresLumieres-v${VERSION}-build${GITHUB_RUN_NUMBER}-${SHORT_SHA}-unsigned.ipa"
          PACKAGE_DIR="$RUNNER_TEMP/ios-package"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/"
          (cd "$PACKAGE_DIR" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/$IPA_NAME" Payload)
          IPA_PATH="$GITHUB_WORKSPACE/$IPA_NAME"
          test -s "$IPA_PATH"
          unzip -t "$IPA_PATH"
          unzip -l "$IPA_PATH" | grep -E 'Payload/[^/]+\.app/Info\.plist'
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
