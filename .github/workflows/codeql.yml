# =============================================================================
#  Analyse de sécurité statique
# =============================================================================
#
#  Le dépôt est PUBLIC : son code est lisible par n'importe qui, y compris par
#  des personnes cherchant une faille. CodeQL analyse le code JavaScript et
#  TypeScript à la recherche de motifs dangereux (injection, données non
#  validées, usage incorrect de la cryptographie, chemins non contrôlés).
#
#  Une fois par semaine, en plus des déclenchements sur `main` : une nouvelle
#  règle d'analyse peut détecter un problème dans du code ancien.
#
#  Actions épinglées à un SHA de commit — voir l'en-tête de `ci.yml`.
# =============================================================================

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Chaque lundi à 3 h du matin (UTC).
    - cron: "0 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Nécessaire pour publier les résultats dans l'onglet Security.
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          # La suite `security-extended` couvre davantage de motifs que la
          # suite par défaut. Le surcoût d'analyse est acceptable pour un
          # projet de cette taille.
          queries: security-extended

      - name: Analyser
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
