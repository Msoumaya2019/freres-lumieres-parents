# =============================================================================
#  Intégration continue
# =============================================================================
#
#  Déclenché à chaque push et à chaque pull request.
#
#  Principe : **si une étape échoue, la CI échoue.** Une pull request ne peut
#  pas être fusionnée dans `main` tant que ce workflow n'est pas vert — ce qui
#  suppose d'avoir activé la protection de branche (voir README, section CI).
#
#  Aucun secret n'est nécessaire : le build de l'administration fonctionne
#  sans configuration Firebase, ce qui est une contrainte de conception
#  volontaire (voir `apps/admin/src/lib/env.ts`).
# =============================================================================
#
#  Les actions tierces sont épinglées à un **SHA de commit**, jamais à un tag
#  majeur. Un tag est mutable : son propriétaire peut le déplacer, et le dépôt
#  est public — donc un tag mobile est un vecteur de compromission de la chaîne
#  de build. Le commentaire `# vN.M.P` garde la version lisible et permet à
#  Dependabot (`.github/dependabot.yml`, écosystème `github-actions`) de
#  proposer la mise à jour du SHA comme celle du commentaire.
# =============================================================================
#
#  Le nom du travail `quality` est **stable**. Il est le point dont dépendent
#  les quatre autres, et il deviendra un contrôle requis par la protection de
#  branche. Le renommer ferait disparaître le contrôle attendu sans que rien
#  ne le signale — une étape ajoutée ne justifie donc pas de le renommer.
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Annule les exécutions précédentes sur la même branche : inutile de faire
# tourner trois fois la même CI après trois commits rapprochés.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Version LTS fixe : une montée de version de Node ne doit jamais casser
  # la CI sans qu'on l'ait décidé.
  NODE_VERSION: "22.22.2"

jobs:
  # ---------------------------------------------------------------------------
  #  Qualité du code : formatage, lint, types, tests unitaires
  # ---------------------------------------------------------------------------
  quality:
    name: Format · Lint · Types · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances
        # `npm ci` exige un lockfile à jour et ne le modifie jamais : c'est ce
        # qui garantit que la CI teste exactement les versions installées.
        run: npm ci

      - name: Auditer les dépendances
        # Le seuil est `high`, et l'échec est bloquant. Mesuré le jour où cette
        # étape a été écrite : 22 avis, tous `moderate`, donc la porte est
        # verte. Un avis `high` ou `critical` fait échouer la CI.
        #
        # Le seuil est haut parce que les avis modérés de cet arbre sont, pour
        # l'essentiel, des outils de construction — `firebase-tools`, `vitest`,
        # `esbuild`, `@expo/cli`, `xcode` — qui ne quittent jamais la machine.
        #
        # Mais la porte ne remplace pas la lecture : un avis réellement
        # joignable dans le paquet livré n'est pas forcément « haut ». C'est
        # arrivé, et c'est écrit dans `docs/04-security.md` — un avis modéré
        # joignable depuis un lien profond forgé. Une exception à cette étape
        # se justifie par écrit, comme `TYPES_SANS_ROUTE` le fait pour les
        # types sans écran ; la faire taire sans raison serait la première
        # chose à refuser dans une revue.
        #
        # Un registre injoignable fait aussi échouer l'étape, avec un message
        # npm explicite : ce n'est pas un avis, et cela se lit.
        run: npm audit --audit-level=high

      - name: Compiler les packages partagés
        # Indispensable avant le typecheck : les applications importent les
        # packages compilés (dossier `dist`).
        run: npm run build:packages

      - name: Vérifier le formatage
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm run test

  # ---------------------------------------------------------------------------
  #  Build de l'interface d'administration
  # ---------------------------------------------------------------------------
  build-admin:
    name: Build Web Admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler les packages partagés
        run: npm run build:packages

      - name: Build de production
        # Le build doit fonctionner SANS aucune variable d'environnement :
        # c'est ce qui permet à la CI de tourner sans secret. L'interface
        # affiche un écran de configuration explicite si elles manquent.
        run: npm run build -w @fl/admin

      - name: Archiver le build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-build
          # `.next` commence par un point, et `upload-artifact` v4 exclut les
          # fichiers cachés **par défaut**. Sans ce réglage l'étape réussit,
          # n'archive rien, et ne le signale que par un avertissement — un
          # artefact absent se remarque le jour où on en a besoin, pas avant.
          path: apps/admin/.next
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  #  Vérification de l'application Expo
  # ---------------------------------------------------------------------------
  mobile-check:
    name: Vérification Expo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler les packages partagés
        run: npm run build:packages

      - name: Vérification de la configuration Expo
        working-directory: apps/mobile
        run: npx expo config --type public > /dev/null

      - name: Exporter le bundle Android
        # Un export Metro résout l'intégralité des imports (monorepo, packages
        # partagés, TypeScript) sans exiger le SDK Android ni Xcode, et en
        # moins d'une minute. Un build natif complet n'apporterait rien de
        # plus à chaque pull request.
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/expo-export

  # ---------------------------------------------------------------------------
  #  Compilation des Cloud Functions
  # ---------------------------------------------------------------------------
  build-functions:
    name: Build Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler les packages partagés
        run: npm run build:packages

      - name: Compiler les fonctions
        run: npm run build -w @fl/functions

  # ---------------------------------------------------------------------------
  #  Tests des règles de sécurité, sur émulateur Firebase
  # ---------------------------------------------------------------------------
  rules:
    name: Tests des règles Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer Java (requis par les émulateurs Firebase)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler les packages partagés
        run: npm run build:packages

      - name: Tester les règles sur émulateur
        # Les émulateurs Firebase remplacent la base réelle : aucun quota
        # n'est consommé, et aucune donnée de production n'est touchée.
        run: npm run rules:test
        env:
          GCLOUD_PROJECT: freres-lumieres-dev
