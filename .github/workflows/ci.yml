name: CI

on:
  push:
    branches: ['main', 'feature/**', 'fix/**', 'chore/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firebase client entrypoints are tracked
        run: |
          git ls-files --error-unmatch apps/mobile/lib/firebase.ts
          git ls-files --error-unmatch apps/admin/lib/firebase.ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Firestore and Storage rules tests
        run: pnpm test:rules:emulated

      - name: Member lifecycle integration tests
        run: pnpm test:phase2:emulated

      - name: Verify Expo dependency matrix
        run: pnpm expo:check

      - name: Verify public Expo configuration
        run: pnpm expo:config

      - name: Build every workspace
        run: pnpm build
